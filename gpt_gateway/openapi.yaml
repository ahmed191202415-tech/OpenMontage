openapi: 3.1.0
info:
  title: OpenMontage GPT Gateway
  version: 0.2.0
  description: Control an OpenMontage installation from a Custom GPT with native pipelines, approvals, async jobs, media inputs and signed render delivery.
servers:
  - url: https://openmontage-production-6f0b.up.railway.app
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ToolRequest:
      type: object
      required: [project_id, inputs]
      properties:
        project_id:
          type: string
        inputs:
          type: object
          additionalProperties: true
        allow_paid:
          type: boolean
          default: false
        allow_side_effects:
          type: boolean
          default: false
security:
  - apiKey: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200': {description: Gateway health and feature flags}
  /api/v1/gateway/features:
    get:
      operationId: getGatewayFeatures
      responses:
        '200': {description: Gateway v2 feature and storage capabilities}
  /api/v1/instructions/core:
    get:
      operationId: getCoreInstructions
      responses:
        '200': {description: OpenMontage agent contract and architecture}
  /api/v1/pipelines:
    get:
      operationId: listPipelines
      responses:
        '200': {description: Available OpenMontage pipelines}
  /api/v1/pipelines/{pipeline_name}:
    get:
      operationId: getPipeline
      parameters:
        - in: path
          name: pipeline_name
          required: true
          schema: {type: string}
      responses:
        '200': {description: Pipeline manifest and ordered stages}
  /api/v1/pipelines/{pipeline_name}/stages/{stage_name}/instructions:
    get:
      operationId: getStageInstructions
      parameters:
        - in: path
          name: pipeline_name
          required: true
          schema: {type: string}
        - in: path
          name: stage_name
          required: true
          schema: {type: string}
      responses:
        '200': {description: Stage director instructions}
  /api/v1/capabilities/summary:
    get:
      operationId: getCapabilitiesSummary
      responses:
        '200': {description: Live provider and runtime capability summary}
  /api/v1/tools/{tool_name}:
    get:
      operationId: getToolInfo
      parameters:
        - in: path
          name: tool_name
          required: true
          schema: {type: string}
      responses:
        '200': {description: OpenMontage tool contract and schemas}
  /api/v1/projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, title, pipeline_type]
              properties:
                project_id: {type: string}
                title: {type: string}
                pipeline_type: {type: string}
                style_playbook: {type: [string, 'null']}
      responses:
        '200': {description: Project initialized}
  /api/v1/projects/{project_id}/state:
    get:
      operationId: getProjectState
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Project state, checkpoint, jobs, media count and next stage}
  /api/v1/projects/{project_id}/media:
    get:
      operationId: listProjectMedia
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Uploaded project media}
    post:
      operationId: uploadProjectMedia
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200': {description: Media saved under the project input assets folder}
  /api/v1/tools/{tool_name}/dry-run:
    post:
      operationId: dryRunTool
      parameters:
        - in: path
          name: tool_name
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolRequest'}
      responses:
        '200': {description: Estimated cost, runtime and status}
  /api/v1/tools/{tool_name}/execute:
    post:
      operationId: executeTool
      description: Use only for short tool calls. Prefer submitToolJob for rendering, generation and other long operations.
      parameters:
        - in: path
          name: tool_name
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolRequest'}
      responses:
        '200': {description: Native OpenMontage ToolResult}
        '409': {description: Explicit approval is required}
  /api/v1/tools/{tool_name}/jobs:
    post:
      operationId: submitToolJob
      description: Queue a long-running OpenMontage tool call and return immediately.
      parameters:
        - in: path
          name: tool_name
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolRequest'}
      responses:
        '200': {description: Queued job record}
        '409': {description: Explicit approval is required before queueing}
  /api/v1/projects/{project_id}/jobs:
    get:
      operationId: listProjectJobs
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, default: 50, minimum: 1, maximum: 200}
      responses:
        '200': {description: Most recent async jobs}
  /api/v1/projects/{project_id}/jobs/{job_id}:
    get:
      operationId: getJobStatus
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
        - in: path
          name: job_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Job status and result when complete}
  /api/v1/projects/{project_id}/jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
        - in: path
          name: job_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Updated job record}
  /api/v1/projects/{project_id}/events:
    get:
      operationId: getProjectEvents
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
        - in: query
          name: after
          schema: {type: integer, default: 0, minimum: 0}
        - in: query
          name: limit
          schema: {type: integer, default: 100, minimum: 1, maximum: 500}
      responses:
        '200': {description: Incremental OpenMontage/Backlot execution events}
  /api/v1/projects/{project_id}/checkpoint:
    post:
      operationId: writeCheckpoint
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, status, artifacts]
              properties:
                stage: {type: string}
                status: {type: string}
                artifacts:
                  type: object
                  additionalProperties: true
                pipeline_type: {type: [string, 'null']}
                style_playbook: {type: [string, 'null']}
                checkpoint_policy: {type: string, default: guided}
                human_approval_required: {type: boolean, default: false}
                human_approved: {type: boolean, default: false}
                review:
                  type: [object, 'null']
                  additionalProperties: true
                cost_snapshot:
                  type: [object, 'null']
                  additionalProperties: true
                error: {type: [string, 'null']}
                metadata:
                  type: [object, 'null']
                  additionalProperties: true
      responses:
        '200': {description: Native OpenMontage checkpoint written}
  /api/v1/projects/{project_id}/artifacts/{artifact_name}:
    get:
      operationId: getArtifact
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
        - in: path
          name: artifact_name
          required: true
          schema: {type: string}
      responses:
        '200': {description: Project artifact content}
  /api/v1/projects/{project_id}/render:
    get:
      operationId: getFinalRender
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Final rendered MP4 through authenticated API
          content:
            video/mp4:
              schema: {type: string, format: binary}
  /api/v1/projects/{project_id}/render-link:
    get:
      operationId: getFinalRenderLink
      description: Return a temporary user-facing render URL. Uses S3-compatible object storage when configured, otherwise an HMAC-signed gateway URL.
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
        - in: query
          name: ttl_seconds
          schema: {type: integer, default: 900, minimum: 60, maximum: 86400}
      responses:
        '200': {description: Temporary render URL}
  /api/v1/public/renders/{project_id}:
    get:
      operationId: downloadSignedRender
      security: []
      parameters:
        - in: path
          name: project_id
          required: true
          schema: {type: string}
        - in: query
          name: expires
          required: true
          schema: {type: integer}
        - in: query
          name: sig
          required: true
          schema: {type: string}
      responses:
        '200':
          description: MP4 behind an expiring signature
          content:
            video/mp4:
              schema: {type: string, format: binary}
